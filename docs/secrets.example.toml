# Copia estas secciones en .streamlit/secrets.toml localmente o en
# Settings > Secrets de Streamlit Community Cloud. No confirmes este archivo
# con valores reales.

[google_service_account]
type = "service_account"
project_id = "TU_PROJECT_ID"
private_key_id = "TU_PRIVATE_KEY_ID"
private_key = """-----BEGIN PRIVATE KEY-----
PEGA_AQUI_LA_CLAVE_PRIVADA_REAL_SOLO_EN_STREAMLIT_SECRETS
-----END PRIVATE KEY-----"""
client_email = "TU_CUENTA_DE_SERVICIO@TU_PROYECTO.iam.gserviceaccount.com"
client_id = "TU_CLIENT_ID"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "TU_URL_DE_CERTIFICADO"

[brujula_sheets]
responses_spreadsheet_id = "ID_DE_LA_HOJA_DE_RESPUESTAS"
responses_worksheet = "responses"
subscribers_spreadsheet_id = "ID_DE_LA_HOJA_DE_CORREOS"
subscribers_worksheet = "subscribers"
